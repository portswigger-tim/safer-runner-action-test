name: Attack replay (supply-chain)

# Real-world supply-chain attack replays against safer-runner-action@main: reproduce the behaviour
# of named 2024-2025 incidents (tj-actions/changed-files, Shai-Hulud npm worm, curl|bash stagers,
# SUNBURST-style DNS tunnelling, dependency confusion) with FAKE canary secrets and self-contained
# non-allowlisted sinks, and prove enforce stops every exfil before anything leaves.
# Default enforce (sudo + docker removed) = the real threat model: a malicious step running as the
# runner user after the action has hardened egress. Checks: tests/checks.sh supply-chain.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, alongside the per-OS suites.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  ALLOWED: >-
    registry.npmjs.org pypi.org files.pythonhosted.org
    .docker.io .docker.com
    *.nip.io *.sslip.io
  PASSTHROUGH: 100-64-0-1.sslip.io pt-hosts.sslip.io
  GH_TOKEN: ${{ github.token }}

jobs:
  supply-chain:
    name: supply-chain attack replay (enforce)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: safer-runner (enforce, defaults)
        uses: portswigger-tim/safer-runner-action@main
        with:
          mode: enforce
          allowed-domains: ${{ env.ALLOWED }}
          passthrough-domains: ${{ env.PASSTHROUGH }}
      - uses: actions/checkout@v7
      - name: replay recent supply-chain attacks (every exfil must be blocked)
        run: tests/checks.sh supply-chain || true
      - name: results
        if: always()
        run: source tests/lib.sh && finish "supply-chain / ubuntu-latest"
      - name: evidence
        if: always()
        run: |
          mkdir -p evidence; cp /var/log/safer-runner/*.json* /var/log/safer-runner/*.log evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-supply-chain
          path: evidence/
          retention-days: 7
