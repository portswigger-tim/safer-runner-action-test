name: Test suite (reusable, per-OS)

# Reusable: every safer-runner-action@main scenario for ONE runner image. Each test-<os>.yml
# calls this once so the Actions UI groups by OS instead of by test. Must-pass, must-fail and
# survival checks live in tests/; results land in each job's step summary and any FAIL fails
# the job. Supply-chain attack replays are separate: attack-replay.yml.
on:
  workflow_call:
    inputs:
      os:
        description: 'Runner image to run the whole suite on'
        required: true
        type: string
      only:
        description: 'Run only this job (enforce|advisory|analyze|strict|crash|containers|http-filter), or all'
        required: false
        type: string
        default: 'all'

# The caller grants contents: write + id-token: write for the http-filter jobs only (a real
# git push the filter must refuse; an OIDC token the platform list must allow). Everything else
# runs read-only.
permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  # nip.io / sslip.io: public wildcard DNS (169.254.169.254.nip.io -> 169.254.169.254), used to
  # prove allowlisted names that resolve to internal addresses are refused (review H1).
  # Exact by default: a bare name is that name only; *.x = subdomains; .x = both.
  ALLOWED: >-
    registry.npmjs.org pypi.org files.pythonhosted.org
    .docker.io .docker.com
    *.nip.io *.sslip.io
  PASSTHROUGH: 100-64-0-1.sslip.io pt-hosts.sslip.io
  # authenticated api.github.com calls (the unauthenticated per-IP limit returns 403 on shared runner IPs)
  GH_TOKEN: ${{ github.token }}

jobs:
  enforce:
    if: ${{ inputs.only == 'all' || inputs.only == 'enforce' }}
    name: enforce
    runs-on: ${{ inputs.os }}
    timeout-minutes: 25
    steps:
      # Default enforce removes sudo (disable-sudo unset = on in enforce, H2)
      - name: safer-runner (enforce, defaults)
        uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: enforce
          allowed-domains: ${{ env.ALLOWED }}
          passthrough-domains: ${{ env.PASSTHROUGH }}

      - name: checkout (through the proxy - agent survival)
        uses: actions/checkout@v7

      - name: must-pass
        run: tests/checks.sh must-pass || true

      - name: must-fail
        run: tests/checks.sh must-fail || true

      - name: SSRF - allowlisted names resolving to internal addresses (H1)
        run: tests/checks.sh ssrf || true

      - name: default enforce removed sudo (H2)
        run: tests/checks.sh privilege-removed || true

      - name: prepare artifact / cache payload
        run: |
          mkdir -p art cache-dir
          head -c 20000000 /dev/urandom > art/payload.bin
          sha256sum art/payload.bin | cut -d' ' -f1 > art.sha256
          cp art/payload.bin cache-dir/
      - uses: actions/upload-artifact@v7
        with:
          name: enforce-${{ inputs.os }}
          path: art/payload.bin
          retention-days: 1
      - uses: actions/download-artifact@v8
        with:
          name: enforce-${{ inputs.os }}
          path: dl
      - uses: actions/cache/save@v6
        with:
          path: cache-dir
          key: suite-${{ github.run_id }}-${{ github.run_attempt }}-enforce-${{ inputs.os }}
      - name: wait for cache consistency (GitHub lag, seen without a proxy too)
        run: sleep 10
      - uses: actions/cache/restore@v6
        id: restore
        with:
          path: cache-dir
          key: suite-${{ github.run_id }}-${{ github.run_attempt }}-enforce-${{ inputs.os }}
          fail-on-cache-miss: true

      - name: results
        if: always()
        run: |
          source tests/lib.sh
          [ "$(sha256sum dl/payload.bin | cut -d' ' -f1)" = "$(cat art.sha256)" ]
          pass_if R.artifact-roundtrip $? "20MB upload-artifact -> download-artifact sha256"
          [ "${{ steps.restore.outcome }}" = success ]; pass_if R.cache-roundtrip $? "cache save -> restore: ${{ steps.restore.outcome }}"
          finish "enforce / ${{ inputs.os }}"

      - name: evidence
        if: always()
        run: |
          mkdir -p evidence; cp /var/log/safer-runner/*.json* /var/log/safer-runner/*.log evidence/ 2>/dev/null || true
          sudo journalctl -u safer-runner-proxy --no-pager > evidence/proxy-journal.txt 2>&1 || true
          sudo iptables-save > evidence/iptables-save.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-enforce-${{ inputs.os }}
          path: evidence/
          retention-days: 7

  advisory:
    if: ${{ inputs.only == 'all' || inputs.only == 'advisory' }}
    name: enforce+disable-sudo:false (ADVISORY)
    runs-on: ${{ inputs.os }}
    timeout-minutes: 25
    steps:
      # Explicit opt-out: sudo kept, job labelled "enforce (ADVISORY - sudo retained)" (H2)
      - name: safer-runner (enforce, sudo retained)
        uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: enforce
          allowed-domains: ${{ env.ALLOWED }}
          passthrough-domains: ${{ env.PASSTHROUGH }}
          disable-sudo: false
      - uses: actions/checkout@v7
      - name: advisory label + sudo kept (H2)
        run: tests/checks.sh privilege-retained || true
      - name: must-fail
        run: tests/checks.sh must-fail || true
      - name: SSRF (H1)
        run: tests/checks.sh ssrf || true
      - name: sudo-dependent must-fail (REDIRECT hole, proxy-side IP guard via /etc/hosts, proxy kill)
        run: tests/checks.sh sudo-must-fail || true
      - name: results
        if: always()
        run: source tests/lib.sh && finish "advisory / ${{ inputs.os }}"
      - name: evidence
        if: always()
        run: |
          mkdir -p evidence; cp /var/log/safer-runner/*.json* /var/log/safer-runner/*.log evidence/ 2>/dev/null || true
          sudo journalctl -u safer-runner-proxy --no-pager > evidence/proxy-journal.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-advisory-${{ inputs.os }}
          path: evidence/
          retention-days: 7

  analyze:
    if: ${{ inputs.only == 'all' || inputs.only == 'analyze' }}
    name: analyze
    runs-on: ${{ inputs.os }}
    timeout-minutes: 25
    steps:
      - name: safer-runner (analyze)
        uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: analyze
      - uses: actions/checkout@v7
      - name: must-pass
        run: tests/checks.sh must-pass || true
      - name: analyze behaviour
        run: tests/checks.sh analyze || true
      - name: artifact payload
        run: mkdir -p art && head -c 5000000 /dev/urandom > art/payload.bin
      - uses: actions/upload-artifact@v7
        with:
          name: analyze-${{ inputs.os }}
          path: art/payload.bin
          retention-days: 1
      - name: results
        if: always()
        run: source tests/lib.sh && finish "analyze / ${{ inputs.os }}"
      - name: evidence
        if: always()
        run: |
          mkdir -p evidence; cp /var/log/safer-runner/*.json* /var/log/safer-runner/*.log evidence/ 2>/dev/null || true
          echo "=== non-proxied egress (what enforce's filter would reject)"; cat /var/log/safer-runner/firewall.log || true
          sudo ss -tunap > evidence/ss.txt 2>&1 || true
          ps -eo user,uid,pid,args > evidence/ps.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-analyze-${{ inputs.os }}
          path: evidence/
          retention-days: 7

  strict:
    if: ${{ inputs.only == 'all' || inputs.only == 'strict' }}
    name: enforce+disable-sudo+docker:remove-group
    runs-on: ${{ inputs.os }}
    timeout-minutes: 25
    steps:
      - name: safer-runner (enforce, strict privilege layer)
        uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: enforce
          disable-sudo: true
          docker: remove-group
          fail-on-tampering: true
      - uses: actions/checkout@v7
      - name: strict checks
        run: tests/checks.sh strict || true
      - name: artifact payload
        run: mkdir -p art && head -c 5000000 /dev/urandom > art/payload.bin
      - uses: actions/upload-artifact@v7
        with:
          name: strict-${{ inputs.os }}
          path: art/payload.bin
          retention-days: 1
      - uses: actions/cache/save@v6
        with:
          path: art
          key: suite-${{ github.run_id }}-${{ github.run_attempt }}-strict-${{ inputs.os }}
      - name: results
        if: always()
        run: source tests/lib.sh && finish "strict / ${{ inputs.os }}"

  # T9: the controls survive their own processes being killed. enforce + sudo retained (ADVISORY)
  # so the checks can SIGKILL the units; fail-on-tampering off because we disrupt on purpose.
  crash-recovery:
    if: ${{ inputs.only == 'all' || inputs.only == 'crash' }}
    name: crash-recovery (enforce, sudo retained)
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    steps:
      - name: safer-runner (enforce, sudo retained so the checks can kill the units)
        uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: enforce
          allowed-domains: ${{ env.ALLOWED }}
          passthrough-domains: ${{ env.PASSTHROUGH }}
          disable-sudo: false
          fail-on-tampering: false
      - uses: actions/checkout@v7
      - name: SIGKILL proxy + CoreDNS; assert restart, CA reuse, egress + enforcement recover
        run: tests/checks.sh crash-recovery || true
      - name: results
        if: always()
        run: source tests/lib.sh && finish "crash-recovery / ${{ inputs.os }}"
      - name: evidence
        if: always()
        run: |
          mkdir -p evidence; cp /var/log/safer-runner/*.json* /var/log/safer-runner/*.log evidence/ 2>/dev/null || true
          sudo journalctl -u safer-runner-proxy --no-pager > evidence/proxy-journal.txt 2>&1 || true
          sudo journalctl -u safer-runner-dns --no-pager > evidence/dns-journal.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-crash-recovery-${{ inputs.os }}
          path: evidence/
          retention-days: 7

  # Container egress. ADVISORY (sudo + docker kept) so the checks can drive docker and poke
  # the rules; a service container started by the runner BEFORE the action exercises F1.
  containers:
    if: ${{ inputs.only == 'all' || inputs.only == 'containers' }}
    name: containers (enforce, docker kept)
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    # Service-container egress probe: tests/probe.py, base64, run by the health-cmd every 5s.
    # (Workflow env is not available in services, hence inline; the anchor is reused below.)
    services: &probe-service
      svc:
        image: python:3.12-slim
        env:
          PROBE: 
        volumes:
          - /tmp/svcout:/out
        options: >-
          -i --health-cmd "echo $PROBE | base64 -d | python3 >> /out/log 2>&1; true"
          --health-interval 5s --health-timeout 45s --health-retries 10000
    steps:
      - name: safer-runner (enforce, sudo + docker kept)
        uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: enforce
          allowed-domains: ${{ env.ALLOWED }}
          passthrough-domains: ${{ env.PASSTHROUGH }}
          disable-sudo: false
          docker: keep
          fail-on-tampering: false
      - uses: actions/checkout@v7
      - name: F1 - docker pull after a pre-action service pull
        run: tests/containers.sh pull || true
      - name: service container by name
        run: tests/containers.sh service ${{ job.services.svc.id }} || true
      - name: traffic (G1-G3, T1-T3, T5-T7)
        run: tests/containers.sh traffic || true
      - name: container DNS (N1-N3)
        run: tests/containers.sh dns || true
      - name: posture sni-only (no CA) + host still intercepted
        run: tests/containers.sh posture || true
      - name: multi-tenant front door stays intercepted
        run: tests/containers.sh front-door enforce || true
      - name: docker build RUN
        run: tests/containers.sh build || true
      - name: fail-closed (T4)
        run: tests/containers.sh failclosed || true
      - name: survives a dockerd restart (T8)
        run: tests/containers.sh restart || true
      - name: results
        if: always()
        run: source tests/lib.sh && finish "containers / ${{ inputs.os }}"
      - name: evidence
        if: always()
        run: |
          mkdir -p evidence; cp /var/log/safer-runner/*.json* /var/log/safer-runner/*.log evidence/ 2>/dev/null || true
          cp /tmp/svcout/log evidence/svc-probe.log 2>/dev/null || true
          sudo iptables-save > evidence/iptables-save.txt 2>&1 || true
          sudo journalctl -u docker --no-pager -n 200 > evidence/dockerd.txt 2>&1 || true
          sudo journalctl -u safer-runner-proxy --no-pager > evidence/proxy-journal.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-containers-${{ inputs.os }}
          path: evidence/
          retention-days: 7

  # Default enforce (docker + sudo removed from steps): the service container is still contained.
  containers-default:
    if: ${{ inputs.only == 'all' || inputs.only == 'containers' }}
    name: containers (default enforce)
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    services: *probe-service
    steps:
      - uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: enforce
          allowed-domains: ${{ env.ALLOWED }}
      - uses: actions/checkout@v7
      - name: service container contained (health-cmd probe)
        run: tests/containers.sh probe-log || true
      - name: results
        if: always()
        run: source tests/lib.sh && finish "containers-default / ${{ inputs.os }}"

  # analyze must not break containers; F1 also applies in analyze
  containers-analyze:
    if: ${{ inputs.only == 'all' || inputs.only == 'containers' }}
    name: containers (analyze)
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    services: *probe-service
    steps:
      - uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: analyze
      - uses: actions/checkout@v7
      - name: F1 in analyze
        run: tests/containers.sh pull || true
      - name: no container breakage
        run: tests/containers.sh analyze || true
      - name: front door passes through in analyze
        run: tests/containers.sh front-door analyze || true
      - name: results
        if: always()
        run: source tests/lib.sh && finish "containers-analyze / ${{ inputs.os }}"

  # http-filter: method + path filtering on allowed hosts. Real push with the job token
  # (contents: write) so git reaches the git-receive-pack POST the filter must refuse.
  http-filter:
    if: ${{ inputs.only == 'all' || inputs.only == 'http-filter' }}
    name: http-filter (enforce)
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: safer-runner (enforce, http-filter)
        uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: enforce
          allowed-domains: ${{ env.ALLOWED }}
          passthrough-domains: ${{ env.PASSTHROUGH }}
          http-filter: |
            api.github.com:     { "*": GET, HEAD }
            registry.npmjs.org: { "*": GET, HEAD }
            github.com:
              "*": "*"
              "*/git-receive-pack": NONE
              "portswigger-tim/srt-carveout/git-receive-pack": "*"
              "octocat/spoon-knife/*": NONE
      - uses: actions/checkout@v7
      - name: API read-only, git push refused (with and without .git), npm read-only, report
        run: tests/checks.sh http-filter || true
      - name: results
        if: always()
        run: source tests/lib.sh && finish "http-filter / ${{ inputs.os }}"
      - name: evidence
        if: always()
        run: |
          mkdir -p evidence; cp /var/log/safer-runner/*.json* /var/log/safer-runner/*.log evidence/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/safer-runner-report.* evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-http-filter-${{ inputs.os }}
          path: evidence/
          retention-days: 7

  # The built-in platform allowlist: the platform hosts are filtered hard, so step logs,
  # artifacts, cache and OIDC only work through its explicit (host, path, method) entries.
  http-filter-platform:
    if: ${{ inputs.only == 'all' || inputs.only == 'http-filter' }}
    name: http-filter platform allowlist (enforce)
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: safer-runner (enforce, platform hosts filtered)
        uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: enforce
          allowed-domains: ${{ env.ALLOWED }}
          passthrough-domains: ${{ env.PASSTHROUGH }}
          http-filter: |
            results-receiver.actions.githubusercontent.com:      { "*": NONE }
            productionresultssa*.blob.core.windows.net:          { "*": NONE }
            run-actions-*-azure-*.actions.githubusercontent.com: { "*": NONE }
      - uses: actions/checkout@v7
      - name: OIDC + the filter is live on each platform host
        run: tests/checks.sh http-filter-platform || true
      - name: outlive a job-lease renewal (the runner renews about once a minute)
        run: sleep 75
      - name: prepare artifact / cache payload
        run: |
          mkdir -p art cache-dir
          head -c 5000000 /dev/urandom > art/payload.bin
          sha256sum art/payload.bin | cut -d' ' -f1 > art.sha256
          cp art/payload.bin cache-dir/
      - uses: actions/upload-artifact@v7
        with:
          name: http-filter-platform-${{ inputs.os }}
          path: art/payload.bin
          retention-days: 1
      - uses: actions/download-artifact@v8
        with:
          name: http-filter-platform-${{ inputs.os }}
          path: dl
      - uses: actions/cache/save@v6
        with:
          path: cache-dir
          key: suite-${{ github.run_id }}-${{ github.run_attempt }}-http-filter-platform-${{ inputs.os }}
      - name: wait for cache consistency
        run: sleep 10
      - uses: actions/cache/restore@v6
        id: restore
        with:
          path: cache-dir
          key: suite-${{ github.run_id }}-${{ github.run_attempt }}-http-filter-platform-${{ inputs.os }}
          fail-on-cache-miss: true
      - name: platform requests all allowed, report
        if: always()
        run: tests/checks.sh http-filter-platform-audit || true
      - name: results
        if: always()
        run: |
          source tests/lib.sh
          [ "$(sha256sum dl/payload.bin | cut -d' ' -f1)" = "$(cat art.sha256)" ]
          pass_if HP.artifact-roundtrip $? "upload-artifact -> download-artifact sha256"
          [ "${{ steps.restore.outcome }}" = success ]; pass_if HP.cache-roundtrip $? "cache save -> restore: ${{ steps.restore.outcome }}"
          finish "http-filter-platform / ${{ inputs.os }}"
      - name: evidence
        if: always()
        run: |
          mkdir -p evidence; cp /var/log/safer-runner/*.json* /var/log/safer-runner/*.log evidence/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/safer-runner-report.* evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-http-filter-platform-${{ inputs.os }}
          path: evidence/
          retention-days: 7

  # allow-github-platform: false turns the built-in list off: the same kind of filter now
  # refuses the cache upload.
  http-filter-no-platform:
    if: ${{ inputs.only == 'all' || inputs.only == 'http-filter' }}
    name: http-filter allow-github-platform:false (enforce)
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    steps:
      - name: safer-runner (enforce, platform list off)
        uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: enforce
          allowed-domains: ${{ env.ALLOWED }}
          allow-github-platform: false
          http-filter: |
            productionresultssa*.blob.core.windows.net:
              "*": "*"
              "actions-cache/*": NONE
      - uses: actions/checkout@v7
      - name: platform list off
        run: tests/checks.sh http-filter-no-platform || true
      - run: mkdir -p cache-dir && head -c 1000000 /dev/urandom > cache-dir/payload.bin
      - uses: actions/cache/save@v6
        with:
          path: cache-dir
          key: suite-${{ github.run_id }}-${{ github.run_attempt }}-http-filter-no-platform-${{ inputs.os }}
      - name: wait for cache consistency
        run: sleep 10
      - uses: actions/cache/restore@v6
        id: restore
        continue-on-error: true
        with:
          path: cache-dir
          key: suite-${{ github.run_id }}-${{ github.run_attempt }}-http-filter-no-platform-${{ inputs.os }}
          fail-on-cache-miss: true
      - name: cache upload refused
        if: always()
        run: tests/checks.sh http-filter-no-platform-audit || true
      - name: results
        if: always()
        run: |
          source tests/lib.sh
          [ "${{ steps.restore.outcome }}" = failure ]; pass_if HN.cache-miss $? "cache restore after a refused upload: ${{ steps.restore.outcome }} (want failure)"
          finish "http-filter-no-platform / ${{ inputs.os }}"
      - name: evidence
        if: always()
        run: mkdir -p evidence; cp /var/log/safer-runner/*.json* /var/log/safer-runner/*.log evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-http-filter-no-platform-${{ inputs.os }}
          path: evidence/
          retention-days: 7

  # analyze: the filter only logs WOULD_BLOCK, and the report suggests an http-filter.
  http-filter-analyze:
    if: ${{ inputs.only == 'all' || inputs.only == 'http-filter' }}
    name: http-filter (analyze)
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    steps:
      - name: safer-runner (analyze, http-filter)
        uses: portswigger-tim/safer-runner-action@v2.2.0
        with:
          mode: analyze
          http-filter: |
            api.github.com: { "*": GET, HEAD }
            github.com:
              "*": "*"
              "*/git-receive-pack": NONE
      - uses: actions/checkout@v7
      - name: WOULD_BLOCK + report
        run: tests/checks.sh http-filter-analyze || true
      - name: results
        if: always()
        run: source tests/lib.sh && finish "http-filter-analyze / ${{ inputs.os }}"
      - name: evidence
        if: always()
        run: |
          mkdir -p evidence; cp /var/log/safer-runner/*.json* /var/log/safer-runner/*.log evidence/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/safer-runner-report.* evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-http-filter-analyze-${{ inputs.os }}
          path: evidence/
          retention-days: 7
