name: Test (ubuntu-24.04)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this job, or all'
        type: choice
        default: all
        options: [all, enforce, advisory, analyze, strict, crash, containers]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, to catch GitHub runner-image drift before consumers hit it.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  actions: read

jobs:
  suite:
    name: ubuntu-24.04
    uses: ./.github/workflows/suite.yml
    with:
      os: ubuntu-24.04
      only: ${{ inputs.only || 'all' }}
