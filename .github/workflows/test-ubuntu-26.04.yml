name: Test (ubuntu-26.04)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this job, or all'
        type: choice
        default: all
        options: [all, enforce, advisory, analyze, strict, crash, containers, http-filter]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, to catch GitHub runner-image drift before consumers hit it.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  actions: read

jobs:
  suite:
    name: ubuntu-26.04
    # suite.yml keeps every job read-only except the http-filter ones (real git push, OIDC)
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/suite.yml
    with:
      os: ubuntu-26.04
      only: ${{ inputs.only || 'all' }}
